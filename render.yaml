services:
  - type: worker
    name: forex-paper-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STARTING_CAPITAL_EUR
        value: "50"
      - key: MAX_LOT
        value: "0.01"
      - key: MAX_RISK_EUR
        value: "0.50"
      - key: TP_RATIO
        value: "2.0"
      - key: TIMEFRAME
        value: "5m"
      - key: OANDA_ENVIRONMENT
        value: "practice"
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
